<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Penny · Expense Tracker</title>
  <meta name="description" content="Track spending and income by month, set a budget, and see where your money goes with charts. Saves in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23C2643B'/%3E%3Ctext x='16' y='22' font-size='17' font-family='Georgia' text-anchor='middle' fill='%23FFF6EC'%3Ep%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><span class="coin" aria-hidden="true">p</span>Penny</div>
      <div class="month" role="group" aria-label="Month">
        <button type="button" class="icon" id="prevMonth" aria-label="Previous month">‹</button>
        <h1 id="monthLabel">—</h1>
        <button type="button" class="icon" id="nextMonth" aria-label="Next month">›</button>
      </div>
      <div class="top-r">
        <select id="currency" aria-label="Currency">
          <option value="INR">₹ INR</option>
          <option value="USD">$ USD</option>
          <option value="EUR">€ EUR</option>
          <option value="GBP">£ GBP</option>
        </select>
        <button class="btn" type="button" id="exportCsv">Export CSV</button>
      </div>
    </header>

    <section class="tiles" aria-label="Summary">
      <div class="tile"><span>Spent</span><strong id="tSpent">—</strong><small id="tSpentCmp"></small></div>
      <div class="tile"><span>Income</span><strong id="tIncome">—</strong></div>
      <div class="tile"><span>Left this month</span><strong id="tLeft">—</strong></div>
      <div class="tile budget">
        <div class="budget-head"><span>Budget</span>
          <button type="button" class="link" id="editBudget">Edit</button></div>
        <strong id="tBudget">—</strong>
        <div class="meter" role="progressbar" aria-label="Budget used" aria-valuemin="0" aria-valuemax="100" id="meter"><i></i></div>
        <small id="tBudgetNote"></small>
      </div>
    </section>

    <div class="grid">
      <section class="panel add" aria-labelledby="addH">
        <h2 id="addH">Add a transaction</h2>
        <form id="txForm" novalidate>
          <div class="seg" role="radiogroup" aria-label="Type">
            <label><input type="radio" name="type" value="expense" checked><span>Expense</span></label>
            <label><input type="radio" name="type" value="income"><span>Income</span></label>
          </div>
          <label>Amount<input name="amount" inputmode="decimal" placeholder="0.00" required></label>
          <label>Category<select name="category" id="catSelect"></select></label>
          <div class="two">
            <label>Date<input name="date" type="date" required></label>
            <label>Note<input name="note" maxlength="60" placeholder="Optional"></label>
          </div>
          <p class="err" id="formErr" role="alert"></p>
          <button class="btn primary" type="submit" id="submitBtn">Add expense</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="catH">
        <h2 id="catH">Where it went</h2>
        <div class="donut-wrap">
          <svg id="donut" viewBox="0 0 120 120" role="img" aria-label="Spending by category"></svg>
          <div class="donut-center"><small>Total</small><b id="donutTotal">—</b></div>
        </div>
        <ul class="legend" id="legend"></ul>
      </section>

      <section class="panel wide" aria-labelledby="dayH">
        <h2 id="dayH">Daily spending</h2>
        <svg id="bars" class="bars" viewBox="0 0 620 160" preserveAspectRatio="none" role="img" aria-label="Spending per day this month"></svg>
        <div class="bars-axis" id="barsAxis"></div>
      </section>

      <section class="panel wide" aria-labelledby="listH">
        <div class="list-head">
          <h2 id="listH">Transactions</h2>
          <div class="filters">
            <input type="search" id="q" placeholder="Search notes" aria-label="Search notes">
            <select id="catFilter" aria-label="Filter by category"><option value="">All categories</option></select>
          </div>
        </div>
        <div id="txList"></div>
      </section>
    </div>

    <footer class="foot">Built by <a href="https://github.com/cryoviper" target="_blank" rel="noopener">Praveen Sinwar</a> · Your data never leaves this browser</footer>
  </div>

  <dialog id="budgetDlg" aria-labelledby="budgetH">
    <form method="dialog">
      <h2 id="budgetH">Monthly budget</h2>
      <label>Amount<input id="budgetInput" inputmode="decimal"></label>
      <div class="dlg-actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Save</button></div>
    </form>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
